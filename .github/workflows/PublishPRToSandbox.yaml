name: Publish PR to Sandbox Environment

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Pull Request number'
        required: true
        type: number
      use_upstream_repo:
        description: 'Fetch PR from upstream repo (microsoft/BCApps)'
        required: false
        type: boolean
        default: false
      use_self_hosted_runner:
        description: 'Use self-hosted runner (faster, requires setup)'
        required: false
        type: boolean
        default: true
      branch_name:
        description: 'New branch name (optional, defaults to pr-<number>-sandbox-publish)'
        required: false
        type: string
      skip_branch_creation:
        description: 'Skip creating a new branch (just use PR branch directly)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

env:
  # Environment configuration
  TENANT_ID: 'f0ac72d1-c1b3-4c2a-a196-8fb82cac5934'
  ENVIRONMENT_NAME: 'a47676_p47575_US_29-0-cdsb'
  COUNTRY: 'us'

jobs:
  publish-to-sandbox:
    name: Publish PR Changes to Sandbox
    runs-on: ${{ inputs.use_self_hosted_runner && 'self-hosted' || 'windows-latest' }}

    steps:
      - name: Validate inputs
        shell: pwsh
        run: |
          if (${{ inputs.pr_number }} -le 0) {
            Write-Error "Invalid PR number: ${{ inputs.pr_number }}"
            exit 1
          }

          $repoSource = if ("${{ inputs.use_upstream_repo }}" -eq "true") { "microsoft/BCApps" } else { "${{ github.repository }}" }
          Write-Host "Processing PR #${{ inputs.pr_number }} from $repoSource"

      - name: Get PR information
        id: pr_info
        uses: actions/github-script@v7
        with:
          script: |
            const useUpstream = ${{ inputs.use_upstream_repo }};
            const owner = useUpstream ? 'microsoft' : context.repo.owner;
            const repo = useUpstream ? 'BCApps' : context.repo.repo;

            console.log(`Fetching PR #${{ inputs.pr_number }} from ${owner}/${repo}`);

            const pr = await github.rest.pulls.get({
              owner: owner,
              repo: repo,
              pull_number: ${{ inputs.pr_number }}
            });

            core.setOutput('pr_branch', pr.data.head.ref);
            core.setOutput('pr_sha', pr.data.head.sha);
            core.setOutput('pr_title', pr.data.title);
            core.setOutput('base_branch', pr.data.base.ref);
            core.setOutput('pr_repo_owner', owner);
            core.setOutput('pr_repo_name', repo);
            core.setOutput('pr_repo_full', `${owner}/${repo}`);
            core.setOutput('fork_owner', pr.data.head.repo.owner.login);
            core.setOutput('fork_repo', pr.data.head.repo.name);
            core.setOutput('clone_url', pr.data.head.repo.clone_url);

            console.log(`PR #${{ inputs.pr_number }}: ${pr.data.title}`);
            console.log(`Branch: ${pr.data.head.ref}`);
            console.log(`Base: ${pr.data.base.ref}`);
            console.log(`Fork: ${pr.data.head.repo.owner.login}/${pr.data.head.repo.name}`);

      - name: Checkout our repository (for scripts)
        uses: actions/checkout@v4
        with:
          path: scripts
          sparse-checkout: |
            .github/scripts
          sparse-checkout-cone-mode: false

      - name: Checkout our repository (for PR code)
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          path: pr-code

      - name: Fetch and create branch from PR
        id: branch_name
        if: ${{ !inputs.skip_branch_creation }}
        shell: pwsh
        working-directory: pr-code
        run: |
          # Generate random branch name
          $randomId = -join ((65..90) + (97..122) + (48..57) | Get-Random -Count 6 | ForEach-Object {[char]$_})
          $branchName = "pr-${{ inputs.pr_number }}-sandbox-$randomId"

          Write-Host "================================================" -ForegroundColor Cyan
          Write-Host "Creating branch: $branchName" -ForegroundColor Cyan
          Write-Host "================================================" -ForegroundColor Cyan
          Write-Host ""

          # Determine which repository to fetch from
          $useUpstream = "${{ inputs.use_upstream_repo }}" -eq "true"
          if ($useUpstream) {
            $fetchRepo = "https://github.com/${{ steps.pr_info.outputs.fork_owner }}/${{ steps.pr_info.outputs.fork_repo }}.git"
            Write-Host "Fetching PR from upstream fork: $fetchRepo" -ForegroundColor Yellow
          } else {
            $fetchRepo = "https://github.com/${{ github.repository }}.git"
            Write-Host "Fetching PR from our repository: $fetchRepo" -ForegroundColor Yellow
          }

          # Fetch the PR branch
          Write-Host "Fetching branch: ${{ steps.pr_info.outputs.pr_branch }}" -ForegroundColor Gray
          git fetch $fetchRepo ${{ steps.pr_info.outputs.pr_branch }}

          # Create new branch from the fetched PR branch
          Write-Host "Creating branch from FETCH_HEAD..." -ForegroundColor Gray
          git checkout -b $branchName FETCH_HEAD

          Write-Host ""
          Write-Host "✓ Branch created: $branchName" -ForegroundColor Green
          Write-Host ""

          # Save branch name for later steps
          echo "name=$branchName" >> $env:GITHUB_OUTPUT

      - name: Configure Git
        shell: pwsh
        working-directory: pr-code
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Configure launch.json for sandbox
        shell: pwsh
        run: |
          Write-Host "================================================" -ForegroundColor Cyan
          Write-Host "Configuring PR #${{ inputs.pr_number }} for Sandbox" -ForegroundColor Cyan
          Write-Host "================================================" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "Environment Details:" -ForegroundColor Yellow
          Write-Host "  Tenant ID: $env:TENANT_ID" -ForegroundColor Gray
          Write-Host "  Environment: $env:ENVIRONMENT_NAME" -ForegroundColor Gray
          Write-Host "  Country: $env:COUNTRY" -ForegroundColor Gray
          Write-Host ""

          # Execute the publish script from scripts directory on pr-code directory
          $scriptPath = Join-Path $env:GITHUB_WORKSPACE "scripts\.github\scripts\PublishToSandbox.ps1"
          $prCodePath = Join-Path $env:GITHUB_WORKSPACE "pr-code"

          Write-Host "Script path: $scriptPath" -ForegroundColor Gray
          Write-Host "PR code path: $prCodePath" -ForegroundColor Gray
          Write-Host ""

          & $scriptPath `
            -TenantId $env:TENANT_ID `
            -EnvironmentName $env:ENVIRONMENT_NAME `
            -Country $env:COUNTRY `
            -BaseFolder $prCodePath

      - name: Commit and push branch
        if: ${{ !inputs.skip_branch_creation }}
        shell: pwsh
        working-directory: pr-code
        run: |
          $branchName = "${{ steps.branch_name.outputs.name }}"

          Write-Host ""
          Write-Host "================================================" -ForegroundColor Cyan
          Write-Host "Committing and Pushing Branch" -ForegroundColor Cyan
          Write-Host "================================================" -ForegroundColor Cyan
          Write-Host ""

          # Debug: Show git remotes
          Write-Host "Git remotes:" -ForegroundColor Yellow
          git remote -v
          Write-Host ""

          # Debug: Show current branch
          Write-Host "Current branch: $(git branch --show-current)" -ForegroundColor Yellow
          Write-Host ""

          # Check if there are changes to commit
          $changes = git status --porcelain

          if ($changes) {
            Write-Host "Changes detected, committing..." -ForegroundColor Yellow
            git add -A

            $commitMessage = @"
          Configure launch.json for sandbox environment

          - Tenant ID: $env:TENANT_ID
          - Environment: $env:ENVIRONMENT_NAME
          - Country: $env:COUNTRY

          Source: PR #${{ inputs.pr_number }}
          "@

            git commit -m "$commitMessage"
            Write-Host "✓ Changes committed" -ForegroundColor Green
          } else {
            Write-Host "No changes to commit - creating empty commit" -ForegroundColor Yellow
            git commit --allow-empty -m "Create sandbox branch for PR #${{ inputs.pr_number }}"
            Write-Host "✓ Empty commit created" -ForegroundColor Green
          }

          Write-Host ""
          Write-Host "Pushing branch '$branchName' to origin..." -ForegroundColor Yellow
          Write-Host ""

          # Push with error handling
          git push -u origin ${branchName}

          if ($LASTEXITCODE -eq 0) {
            Write-Host ""
            Write-Host "✓✓✓ PUSH SUCCESSFUL! ✓✓✓" -ForegroundColor Green
            Write-Host ""

            # Verify the branch exists on remote
            Write-Host "Verifying branch on remote..." -ForegroundColor Yellow
            $remoteBranch = git ls-remote --heads origin $branchName
            if ($remoteBranch) {
              Write-Host "✓ Branch confirmed on remote!" -ForegroundColor Green
              Write-Host "  $remoteBranch" -ForegroundColor Gray
            }

            Write-Host ""
            Write-Host "View branch at: https://github.com/${{ github.repository }}/tree/$branchName" -ForegroundColor Cyan
            Write-Host ""
          } else {
            Write-Host ""
            Write-Host "✗✗✗ PUSH FAILED! ✗✗✗" -ForegroundColor Red
            Write-Host "Exit code: $LASTEXITCODE" -ForegroundColor Red
            Write-Host ""
            throw "Failed to push branch to remote"
          }

      - name: Summary
        shell: pwsh
        run: |
          Write-Host ""
          Write-Host "================================================" -ForegroundColor Green
          Write-Host "✓ Configuration Complete!" -ForegroundColor Green
          Write-Host "================================================" -ForegroundColor Green
          Write-Host ""
          Write-Host "Details:" -ForegroundColor Yellow
          Write-Host "  Source: ${{ steps.pr_info.outputs.pr_repo_full }}" -ForegroundColor Gray
          Write-Host "  PR: #${{ inputs.pr_number }} - ${{ steps.pr_info.outputs.pr_title }}" -ForegroundColor Gray

          if ("${{ inputs.skip_branch_creation }}" -eq "true") {
            Write-Host "  Branch: ${{ steps.pr_info.outputs.pr_branch }} (original PR branch)" -ForegroundColor Gray
          } else {
            Write-Host "  Branch: ${{ steps.branch_name.outputs.name }} (pushed to ${{ github.repository }})" -ForegroundColor Gray
          }

          Write-Host "  Environment: $env:ENVIRONMENT_NAME" -ForegroundColor Gray
          Write-Host "  Tenant: $env:TENANT_ID" -ForegroundColor Gray
          Write-Host ""
          Write-Host "Launch.json configured for:" -ForegroundColor Yellow
          Write-Host "  ✓ System Application" -ForegroundColor Gray
          Write-Host "  ✓ Business Foundation" -ForegroundColor Gray
          Write-Host ""
          Write-Host "Codespaces URL:" -ForegroundColor Yellow
          Write-Host "  https://codespaces.new/${{ github.repository }}?ref=${{ steps.branch_name.outputs.name }}&devcontainer_path=.devcontainer/sandbox-publisher/devcontainer.json" -ForegroundColor Cyan
          Write-Host ""
          Write-Host "Next: Click 'Open in Codespaces' or press F5 in local VS Code" -ForegroundColor Cyan
          Write-Host ""

          if ("${{ inputs.use_upstream_repo }}" -eq "true") {
            Write-Host "Note: PR was fetched from upstream repository (microsoft/BCApps)" -ForegroundColor Cyan
            Write-Host "The branch has been pushed to your fork: ${{ github.repository }}" -ForegroundColor Cyan
          }

      - name: Comment on PR (fork only)
        if: ${{ !inputs.use_upstream_repo }}
        uses: actions/github-script@v7
        with:
          script: |
            // Always use the workflow-created branch (where launch.json is configured)
            const configuredBranch = "${{ steps.branch_name.outputs.name }}";
            const prBranch = "${{ steps.pr_info.outputs.pr_branch }}";
            const skipBranchCreation = "${{ inputs.skip_branch_creation }}" === "true";

            // For display purposes
            const branchName = skipBranchCreation ? prBranch : configuredBranch;

            const comment = `## ⚙️ Configured for Sandbox Environment

            Your PR has been configured for testing in the sandbox environment!

            ### 🚀 Quick Start - Open in Codespaces

            [![Open in GitHub Codespaces](https://github.com/codespaces/badge.svg)](https://codespaces.new/${{ github.repository }}?ref=${configuredBranch}&devcontainer_path=.devcontainer/sandbox-publisher/devcontainer.json)

            Click the button above to:
            - ✅ Open pre-configured development environment
            - ✅ AL extension already installed
            - ✅ Launch.json ready for your sandbox
            - ✅ Just press F5 to publish and debug!

            ### 💻 Or Use Local VS Code

            <details>
            <summary>Click to expand local setup instructions</summary>

            1. Checkout the branch: \`git checkout ${branchName}\`
            2. Open workspace in VS Code:
               - \`src/System Application/SystemApplication.code-workspace\` OR
               - \`src/Business Foundation/BusinessFoundation.code-workspace\`
            3. **Press F5** to publish and debug in the sandbox
            4. Sign in with Microsoft Entra credentials when prompted

            </details>

            ### Environment Details
            - **Tenant ID**: \`${{ env.TENANT_ID }}\`
            - **Environment**: \`${{ env.ENVIRONMENT_NAME }}\`
            - **Country**: \`${{ env.COUNTRY }}\`

            ### Launch.json Configured For
            - ✅ System Application
            - ✅ Business Foundation

            ### Branch
            ${branchName === "${{ steps.pr_info.outputs.pr_branch }}"
              ? `Configuration on PR branch: \`${branchName}\``
              : `Configuration committed to: \`${branchName}\``
            }

            **Note:** Apps are NOT automatically published. Use Codespaces + F5 or local VS Code + F5 to publish.

            ---
            *Configured by GitHub Actions workflow*`;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ inputs.pr_number }},
              body: comment
            });

      - name: Create workflow summary
        if: ${{ inputs.use_upstream_repo }}
        shell: pwsh
        run: |
          # Always use the workflow-created branch (where launch.json is configured)
          $configuredBranch = "${{ steps.branch_name.outputs.name }}"
          $prBranch = "${{ steps.pr_info.outputs.pr_branch }}"
          $skipBranchCreation = "${{ inputs.skip_branch_creation }}" -eq "true"

          # For display purposes
          $branchName = if ($skipBranchCreation) { $prBranch } else { $configuredBranch }

          $repoName = "${{ github.repository }}"
          # Codespaces URL always uses the configured branch
          $codespacesUrl = "https://codespaces.new/$repoName`?ref=$configuredBranch&devcontainer_path=.devcontainer/sandbox-publisher/devcontainer.json"

          $summary = @"
          ## ⚙️ Configured PR from microsoft/BCApps for Sandbox

          Successfully configured PR from the upstream repository for testing in your sandbox environment!

          ### 🚀 Quick Start - Open in Codespaces

          [![Open in GitHub Codespaces](https://github.com/codespaces/badge.svg)]($codespacesUrl)

          **Click the badge above to:**
          - ✅ Open pre-configured development environment in the cloud
          - ✅ AL extension already installed and ready
          - ✅ Launch.json configured for your sandbox
          - ✅ Just press F5 to publish and debug!

          **No local setup needed!**

          ---

          ### 💻 Or Use Local VS Code

          <details>
          <summary>Click to expand local setup instructions</summary>

          1. Checkout the branch: ``git fetch && git checkout $branchName``
          2. Open workspace in VS Code:
             - ``src/System Application/SystemApplication.code-workspace`` OR
             - ``src/Business Foundation/BusinessFoundation.code-workspace``
          3. **Press F5** to publish and debug in the sandbox
          4. Sign in with Microsoft Entra credentials when prompted

          </details>

          ---

          ### Source PR
          - **Repository**: ${{ steps.pr_info.outputs.pr_repo_full }}
          - **PR Number**: #${{ inputs.pr_number }}
          - **PR Title**: ${{ steps.pr_info.outputs.pr_title }}

          ### Environment Details
          - **Tenant ID**: ``$env:TENANT_ID``
          - **Environment**: ``$env:ENVIRONMENT_NAME``
          - **Country**: ``$env:COUNTRY``

          ### Launch.json Configured For
          - ✅ System Application
          - ✅ Business Foundation

          ### Branch Created
          $(if ("${{ inputs.skip_branch_creation }}" -eq "true") {
            "Configuration on PR branch: ``$branchName``"
          } else {
            "Configuration committed to: ``$branchName`` in your fork"
          })

          ### Note
          - Apps are **NOT automatically published** by this pipeline
          - Use **Codespaces + F5** or **local VS Code + F5** to publish apps
          - Since this PR is from the upstream repository (microsoft/BCApps), a comment could not be posted on the original PR
          - The configuration has been successfully created in your fork repository
          "@

          echo $summary >> $env:GITHUB_STEP_SUMMARY
          Write-Host $summary

